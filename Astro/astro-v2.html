<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Astro — venda por conversa, sem perder o controle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#6C5CE7; --brand-ink:#5A4AD1; --brand-soft:#F1EFFE;
  --accent:#00C2A8; --accent-soft:#E4F8F5;
  --bg:#F8F9FC; --card:#FFFFFF; --card-2:#F3F4F8;
  --ink:#171725; --ink-2:#6B6B7A; --ink-3:#9A9AA8;
  --line:#E5E7EB; --line-2:#D6D9E0;
  --ok:#0E9F6E; --ok-bg:#E6F6EF;
  --warn:#B54708; --warn-bg:#FEF3E2;
  --err:#D42D20; --err-bg:#FDECEA;
  --info:#2563EB; --info-bg:#E8EFFE;
  --sh-1:0 1px 2px rgba(23,23,37,.04),0 1px 3px rgba(23,23,37,.06);
  --sh-2:0 4px 12px rgba(23,23,37,.06),0 12px 32px rgba(23,23,37,.06);
  --sh-3:0 24px 64px rgba(23,23,37,.16);
  --r:12px; --r-lg:18px; --r-xl:26px;
  --e-out:cubic-bezier(.22,1,.36,1);
  --e-soft:cubic-bezier(.4,0,.2,1);
}
[data-theme="dark"]{
  --brand:#8B7CFF; --brand-ink:#A395FF; --brand-soft:#211E38;
  --accent:#2ED9BE; --accent-soft:#122E2A;
  --bg:#0E0E14; --card:#16161F; --card-2:#1E1E29;
  --ink:#F2F2F6; --ink-2:#9C9CAE; --ink-3:#6E6E80;
  --line:#26262F; --line-2:#33333F;
  --ok:#34D399; --ok-bg:#10291F; --warn:#F5B544; --warn-bg:#2C2212;
  --err:#F87171; --err-bg:#2C1616; --info:#7DA6FF; --info-bg:#141F38;
  --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 8px 28px rgba(0,0,0,.45); --sh-3:0 24px 64px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:Poppins,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
img{max-width:100%}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:9px;border:2px solid var(--bg)}

/* ---------- primitivos ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:10px;font-weight:500;font-size:14px;transition:background .18s var(--e-soft),border-color .18s,transform .12s var(--e-out),box-shadow .18s;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn-primary{background:var(--brand);color:#fff;box-shadow:0 1px 2px rgba(108,92,231,.3)}
.btn-primary:hover{background:var(--brand-ink);box-shadow:0 6px 18px rgba(108,92,231,.28)}
.btn-ghost{border:1px solid var(--line-2);color:var(--ink);background:var(--card)}
.btn-ghost:hover{border-color:var(--ink-3);background:var(--card)}
.btn-quiet{background:var(--card-2);color:var(--ink)}
.btn-quiet:hover{background:var(--line)}
.btn-danger{background:var(--err-bg);color:var(--err)}
.btn-sm{height:34px;padding:0 13px;font-size:13px;border-radius:9px}
.btn-lg{height:50px;padding:0 24px;font-size:15px;border-radius:12px}
.btn-icon{width:40px;height:40px;padding:0;border-radius:11px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn .spin{width:15px;height:15px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-1)}
.pad{padding:18px}.pad-lg{padding:24px}
.field{display:block;margin-bottom:15px}
.field>span{display:block;font-size:13px;font-weight:500;color:var(--ink-2);margin-bottom:6px}
.input,.select,.textarea{width:100%;background:var(--card);border:1px solid var(--line-2);border-radius:10px;padding:11px 13px;font-size:14px;transition:border-color .16s,box-shadow .16s}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.input[aria-invalid="true"]{border-color:var(--err);box-shadow:0 0 0 3px var(--err-bg)}
.textarea{min-height:96px;resize:vertical}
.hint{font-size:12px;color:var(--ink-3);margin-top:6px}
.err-msg{font-size:12.5px;color:var(--err);margin-top:5px;display:block}

.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:500;background:var(--card-2);color:var(--ink-2)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.err{background:var(--err-bg);color:var(--err)}
.chip.info{background:var(--info-bg);color:var(--info)}
.chip.brand{background:var(--brand-soft);color:var(--brand)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.muted{color:var(--ink-2)}.tiny{font-size:12px;color:var(--ink-3)}
.strong{font-weight:600}.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stack{display:flex;flex-direction:column;gap:3px}
.wrap{flex-wrap:wrap}
.grid{display:grid;gap:16px}
.sep{height:1px;background:var(--line);margin:16px 0}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-size:12.5px;font-weight:600;flex:none}
.thumb{width:44px;height:44px;border-radius:11px;background:var(--card-2);display:grid;place-items:center;font-size:18px;flex:none;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}

.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:22px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:11px 14px;font-size:14px;font-weight:500;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:color .16s}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}

.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--card)}
table{width:100%;border-collapse:collapse;min-width:620px}
th{text-align:left;font-size:12px;font-weight:600;color:var(--ink-3);padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card-2)}
td{padding:14px 16px;border-bottom:1px solid var(--line);font-size:14px}
tbody tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer;transition:background .14s}
tbody tr:hover{background:var(--card-2)}

.empty{text-align:center;padding:56px 22px;border:1px dashed var(--line-2);border-radius:var(--r-lg);background:var(--card)}
.empty .ic{width:52px;height:52px;border-radius:15px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;margin:0 auto 14px}
.skel{background:linear-gradient(90deg,var(--card-2) 25%,var(--line) 50%,var(--card-2) 75%);background-size:200% 100%;animation:sh 1.3s infinite;border-radius:9px}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
.switch{width:42px;height:24px;border-radius:999px;background:var(--line-2);position:relative;transition:background .2s var(--e-soft);flex:none}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .24s var(--e-out);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch[aria-checked="true"]{background:var(--brand)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}

/* ---------- landing ---------- */
.shell{max-width:1140px;margin:0 auto;padding:0 20px}
.lp-header{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:border-color .25s,background .25s}
.lp-header.stuck{border-bottom-color:var(--line)}
.lp-nav{display:flex;align-items:center;gap:26px;height:68px}
.lp-nav a.lk{font-size:14px;color:var(--ink-2);display:none;transition:color .16s}
.lp-nav a.lk:hover{color:var(--ink)}
@media(min-width:900px){.lp-nav a.lk{display:inline}}
.logo{display:inline-flex;align-items:center;gap:9px;font-weight:600;font-size:17.5px;letter-spacing:-.02em}
.logo-mark{width:30px;height:30px;border-radius:9px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.burger{display:grid;place-items:center;width:40px;height:40px;border-radius:10px}
@media(min-width:900px){.burger{display:none}}

section.lp{padding:76px 0}
@media(min-width:900px){section.lp{padding:104px 0}}
.eyebrow{font-size:13px;font-weight:500;color:var(--brand);margin-bottom:12px}
h1.hero{font-size:clamp(34px,6.4vw,58px);line-height:1.06;font-weight:600;letter-spacing:-.035em;max-width:15ch}
h2.sec{font-size:clamp(26px,4vw,38px);line-height:1.14;font-weight:600;letter-spacing:-.028em;max-width:20ch}
p.lead{font-size:clamp(15.5px,2vw,18px);color:var(--ink-2);max-width:56ch;margin-top:16px;line-height:1.6}
.hero-wrap{padding-top:44px}
.hero-cta{display:flex;gap:12px;margin-top:32px;flex-wrap:wrap}
.hero-note{font-size:13px;color:var(--ink-3);margin-top:16px}

.mock{border:1px solid var(--line);border-radius:var(--r-xl);background:var(--card);box-shadow:var(--sh-3);overflow:hidden;position:relative}
.mock-bar{display:flex;align-items:center;gap:7px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card-2)}
.mock-bar i{width:9px;height:9px;border-radius:50%;background:var(--line-2);display:block}
.mock-tag{position:absolute;top:12px;right:14px;z-index:2}
.mock-body{display:grid;grid-template-columns:1fr;gap:14px;padding:18px}
@media(min-width:760px){.mock-body{grid-template-columns:172px 1fr}}
.mock-side{display:none;flex-direction:column;gap:3px}
@media(min-width:760px){.mock-side{display:flex}}
.mock-nav{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;font-size:13px;color:var(--ink-2)}
.mock-nav.on{background:var(--brand);color:#fff}
.mini{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:520px){.mini{grid-template-columns:repeat(4,1fr)}}
.mini div{border:1px solid var(--line);border-radius:12px;padding:12px}
.mini .l{font-size:11.5px;color:var(--ink-2)}
.mini .v{font-size:19px;font-weight:600;letter-spacing:-.02em;margin-top:3px}

.prob{display:grid;grid-template-columns:1fr;gap:0;border-top:1px solid var(--line)}
.prob-row{display:grid;grid-template-columns:1fr;gap:6px;padding:22px 0;border-bottom:1px solid var(--line)}
@media(min-width:760px){.prob-row{grid-template-columns:1fr 1.3fr;gap:32px;align-items:baseline}}
.prob-row h4{font-size:16.5px;font-weight:600;letter-spacing:-.01em}
.prob-row p{font-size:14.5px;color:var(--ink-2)}

.feat{display:grid;grid-template-columns:1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
@media(min-width:640px){.feat{grid-template-columns:1fr 1fr}}
@media(min-width:1000px){.feat{grid-template-columns:repeat(4,1fr)}}
.feat>div{background:var(--card);padding:24px}
.feat h4{font-size:15.5px;font-weight:600;margin:14px 0 6px}
.feat p{font-size:13.5px;color:var(--ink-2)}
.feat .ic{width:38px;height:38px;border-radius:11px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}

.flow{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:820px){.flow{grid-template-columns:repeat(6,1fr);gap:8px}}
.flow-node{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:16px 14px;position:relative}
.flow-node .n{font-size:11.5px;color:var(--brand);font-weight:600}
.flow-node .t{font-size:14.5px;font-weight:600;margin-top:5px}
.flow-node .d{font-size:12.5px;color:var(--ink-2);margin-top:4px}

.plans{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:820px){.plans{grid-template-columns:repeat(3,1fr)}}
.plan{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--card);padding:26px;display:flex;flex-direction:column}
.plan.hi{border-color:var(--brand);box-shadow:0 12px 40px rgba(108,92,231,.14)}
.plan ul{list-style:none;margin:18px 0;display:flex;flex-direction:column;gap:9px;flex:1}
.plan li{font-size:13.5px;color:var(--ink-2);display:flex;gap:9px;align-items:flex-start}
.plan li svg{color:var(--accent);flex:none;margin-top:2px}
.faq-item{border-bottom:1px solid var(--line)}
.faq-q{width:100%;display:flex;justify-content:space-between;gap:16px;align-items:center;padding:19px 0;text-align:left;font-size:15.5px;font-weight:500}
.faq-a{overflow:hidden;height:0}
.faq-a p{font-size:14.5px;color:var(--ink-2);padding-bottom:19px;max-width:70ch}
.lp-footer{border-top:1px solid var(--line);padding:44px 0 34px;font-size:13.5px;color:var(--ink-2)}
.fcols{display:grid;grid-template-columns:1fr 1fr;gap:26px}
@media(min-width:820px){.fcols{grid-template-columns:2fr 1fr 1fr 1fr}}
.fcols h5{font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:10px}
.fcols a{display:block;padding:4px 0;color:var(--ink-2);transition:color .16s}
.fcols a:hover{color:var(--brand)}

/* ---------- auth ---------- */
.auth{min-height:100dvh;display:grid;grid-template-columns:1fr;place-items:center;padding:26px}
@media(min-width:960px){.auth{grid-template-columns:1fr 1fr;place-items:stretch;padding:20px}}
.auth-art{display:none;border-radius:var(--r-xl);background:var(--ink);color:var(--bg);padding:44px;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
@media(min-width:960px){.auth-art{display:flex}}
.auth-art h3{font-size:34px;line-height:1.12;font-weight:600;letter-spacing:-.03em;max-width:14ch}
.auth-box{width:100%;max-width:410px;margin:auto;padding:20px}

/* ---------- app ---------- */
.sidebar{position:fixed;inset:0 auto 0 0;width:250px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:60;transform:translateX(-100%);visibility:hidden}
@media(min-width:1024px){.sidebar{transform:none!important;visibility:visible!important}}
.scrim-nav{position:fixed;inset:0;background:rgba(23,23,37,.42);z-index:55;opacity:0}
@media(min-width:1024px){.scrim-nav{display:none!important}}
.nav{flex:1;overflow-y:auto;padding:8px}
.nav-item{display:flex;align-items:center;gap:11px;width:100%;padding:9px 11px;border-radius:10px;color:var(--ink-2);font-size:14px;font-weight:500;transition:background .16s,color .16s}
.nav-item:hover{background:var(--card-2);color:var(--ink)}
.nav-item.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.nav-group{font-size:11px;font-weight:600;color:var(--ink-3);padding:16px 12px 6px}
.main{min-height:100dvh;padding-bottom:78px}
@media(min-width:1024px){.main{margin-left:250px;padding-bottom:0}}
.topbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:11px 16px;display:flex;align-items:center;gap:11px}
@media(min-width:1024px){.topbar{padding:13px 28px}}
.page{padding:22px 16px 44px;max-width:1160px}
@media(min-width:1024px){.page{padding:28px 28px 60px}}
.phead{margin-bottom:22px}
.phead h1{font-size:24px;font-weight:600;letter-spacing:-.025em}
@media(min-width:1024px){.phead h1{font-size:28px}}
.phead p{color:var(--ink-2);font-size:14px;margin-top:3px;max-width:62ch}
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:45;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
@media(min-width:1024px){.bnav{display:none}}
.bn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:10.5px;font-weight:500;color:var(--ink-3);border-radius:10px}
.bn.on{color:var(--brand)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:900px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:17px}
.kpi .l{font-size:12.5px;color:var(--ink-2);font-weight:500}
.kpi .v{font-size:25px;font-weight:600;letter-spacing:-.03em;margin-top:5px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;margin-top:3px;color:var(--ink-3)}
.demo-bar{background:var(--warn-bg);color:var(--warn);border-bottom:1px solid color-mix(in srgb,var(--warn) 25%,transparent);padding:9px 16px;font-size:13px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}

/* ---------- overlays ---------- */
.scrim{position:fixed;inset:0;background:rgba(23,23,37,.5);backdrop-filter:blur(3px);z-index:70;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.scrim{align-items:center;padding:24px}}
.modal{background:var(--card);width:100%;max-width:600px;max-height:88dvh;overflow-y:auto;border-radius:22px 22px 0 0;box-shadow:var(--sh-3)}
@media(min-width:700px){.modal{border-radius:var(--r-xl)}}
.mhead{position:sticky;top:0;background:var(--card);padding:19px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;z-index:2}
.mhead h4{font-size:17.5px;font-weight:600;letter-spacing:-.015em}
.mbody{padding:22px}
.mfoot{position:sticky;bottom:0;background:var(--card);padding:15px 22px calc(15px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
#toasts{position:fixed;z-index:90;bottom:90px;left:16px;right:16px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
@media(min-width:1024px){#toasts{bottom:24px;left:auto;right:24px;width:350px}}
.toast{background:var(--ink);color:var(--bg);padding:13px 16px;border-radius:12px;font-size:13.5px;box-shadow:var(--sh-3);display:flex;gap:10px;align-items:flex-start}
.toast .bar{width:3px;border-radius:3px;background:var(--accent);align-self:stretch;flex:none}
.toast.err .bar{background:var(--err)}.toast.warn .bar{background:var(--warn)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="toasts"></div>
<div id="overlay"></div>
<div id="root"></div>
<script>
/* ================================================================
   ASTRO — camada de aplicação
   Persistência: window.storage (chave/valor, por usuário).
   Todo dado exibido vem daqui ou é calculado. Nada é hardcoded.
   ================================================================ */

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const el = h => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstElementChild; };
const uid = p => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const BRL = n => (n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const NUM = n => (n||0).toLocaleString('pt-BR');
const initials = n => (n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dfmt = iso => new Date(iso).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'});
const dtfmt = iso => new Date(iso).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});

/* ---------------- MOTION ----------------
   Sistema único de movimento (Web Animations API).
   No projeto React estes tokens viram props do motion/react:
   ENTER -> initial/animate, STAGGER -> transition.staggerChildren. */
const RM = matchMedia('(prefers-reduced-motion: reduce)');
const M = {
  dur:{ xs:.14, sm:.22, md:.34, lg:.5 },
  ease:{ out:[.22,1,.36,1], soft:[.4,0,.2,1], spring:[.34,1.4,.44,1] },
  cb: e => `cubic-bezier(${e.join(',')})`
};
function anim(node, keyframes, {d=M.dur.md, e=M.ease.out, delay=0, fill='both'}={}){
  if(!node) return null;
  if(RM.matches){ node.style.opacity=''; node.style.transform=''; return null; }
  return node.animate(keyframes, {duration:d*1000, delay:delay*1000, easing:M.cb(e), fill});
}
const enter = (n,o={}) => anim(n,[{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],{d:M.dur.md,...o});
const pop   = (n,o={}) => anim(n,[{opacity:0,transform:'scale(.96)'},{opacity:1,transform:'none'}],{d:M.dur.sm,e:M.ease.spring,...o});
function stagger(nodes, step=.045, o={}){
  [...nodes].forEach((n,i)=>enter(n,{delay:i*step, ...o}));
}
/* revela ao entrar na viewport — usado só na landing */
const io = new IntersectionObserver(es=>es.forEach(x=>{
  if(x.isIntersecting){ enter(x.target,{delay:(+x.target.dataset.rd||0)}); io.unobserve(x.target); }
}),{threshold:.14, rootMargin:'0px 0px -8% 0px'});
function reveal(scope){
  scope.querySelectorAll('[data-reveal]').forEach(n=>{
    if(!RM.matches) n.style.opacity='0';
    io.observe(n);
  });
}

/* ---------------- STORAGE ----------------
   Contrato assíncrono, igual ao de um backend real.
   Trocar este objeto por chamadas HTTP é a única mudança
   necessária para plugar um Postgres/Supabase por trás. */
const MEM = new Map();
const hasStore = typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function';
const kv = {
  async get(k, fallback=null){
    if(hasStore){
      try{ const r = await window.storage.get(k); if(r) return JSON.parse(r.value); }catch(e){}
    }
    return MEM.has(k) ? JSON.parse(MEM.get(k)) : fallback;
  },
  async set(k, v){
    const raw = JSON.stringify(v);
    MEM.set(k, raw);
    if(hasStore){ try{ await window.storage.set(k, raw); }catch(e){} }
    return v;
  },
  async del(k){
    MEM.delete(k);
    if(hasStore){ try{ await window.storage.delete(k); }catch(e){} }
  }
};

/* Escopo multi-tenant: TODA chave de dado carrega o id da empresa.
   Nenhuma leitura acontece sem companyId — é o mesmo princípio de
   uma cláusula WHERE company_id = ? obrigatória no backend. */
const K = {
  users:'astro:users',
  session:'astro:session',
  company: c => `astro:co:${c}:company`,
  products: c => `astro:co:${c}:products`,
  customers: c => `astro:co:${c}:customers`,
  orders: c => `astro:co:${c}:orders`,
  team: c => `astro:co:${c}:team`,
  automations: c => `astro:co:${c}:automations`,
  ai: c => `astro:co:${c}:ai`,
  integrations: c => `astro:co:${c}:integrations`,
  notifications: c => `astro:co:${c}:notifications`,
  conversations: c => `astro:co:${c}:conversations`,
  audit: c => `astro:co:${c}:audit`
};

async function sha256(txt){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}

/* ---------------- ESTADO ---------------- */
const S = { user:null, company:null, membership:null, demo:false, route:'landing' };

const api = {
  /* --- auth --- */
  async register({nome,email,senha,empresa}){
    const users = await kv.get(K.users, []);
    if(users.some(u=>u.email.toLowerCase()===email.toLowerCase()))
      throw new Error('Já existe uma conta com este e-mail.');
    const companyId = uid('co');
    const salt = uid('s');
    const user = { id:uid('u'), nome, email, salt, hash:await sha256(salt+senha),
                   companyId, role:'Proprietário', criadoEm:new Date().toISOString() };
    users.push(user);
    await kv.set(K.users, users);
    await kv.set(K.company(companyId), { id:companyId, nome:empresa, doc:'', telefone:'',
      endereco:'', onboarded:false, demo:false, criadoEm:new Date().toISOString() });
    for(const key of ['products','customers','orders','automations','notifications','conversations','audit'])
      await kv.set(K[key](companyId), []);
    await kv.set(K.team(companyId), [{ id:user.id, nome, email, papel:'Proprietário', ativo:true, convidadoEm:user.criadoEm }]);
    await kv.set(K.ai(companyId), { nome:'', tom:'Próximo e objetivo', abertura:'', regras:'',
      transferir:'', horario:'24h', ativa:false });
    await kv.set(K.integrations(companyId), { whatsapp:{status:'desconectado'}, pagamentos:{status:'desconectado'}, webhook:{status:'desconectado'} });
    return user;
  },
  async login({email,senha}){
    const users = await kv.get(K.users, []);
    const u = users.find(x=>x.email.toLowerCase()===email.toLowerCase());
    if(!u) throw new Error('E-mail não encontrado.');
    if(await sha256(u.salt+senha) !== u.hash) throw new Error('Senha incorreta.');
    await kv.set(K.session, { userId:u.id, companyId:u.companyId, em:Date.now() });
    return u;
  },
  async logout(){ await kv.del(K.session); S.user=null; S.company=null; },
  async resetPassword(email, nova){
    const users = await kv.get(K.users, []);
    const u = users.find(x=>x.email.toLowerCase()===email.toLowerCase());
    if(!u) throw new Error('E-mail não encontrado.');
    u.salt = uid('s'); u.hash = await sha256(u.salt+nova);
    await kv.set(K.users, users);
  },
  async restore(){
    const s = await kv.get(K.session);
    if(!s) return null;
    const users = await kv.get(K.users, []);
    const u = users.find(x=>x.id===s.userId);
    if(!u) { await kv.del(K.session); return null; }
    S.user = u;
    S.company = await kv.get(K.company(u.companyId));
    S.demo = !!(S.company && S.company.demo);
    return u;
  },

  /* --- CRUD genérico, sempre escopado à empresa da sessão --- */
  cid(){ if(!S.user) throw new Error('Sessão expirada.'); return S.user.companyId; },
  async list(res){ return await kv.get(K[res](this.cid()), []); },
  async save(res, rows){ return await kv.set(K[res](this.cid()), rows); },
  async create(res, obj){
    const rows = await this.list(res);
    const row = { id:uid(res.slice(0,3)), criadoEm:new Date().toISOString(), ...obj };
    rows.unshift(row); await this.save(res, rows); await this.log(`criou ${res}`, row.nome||row.id);
    return row;
  },
  async update(res, id, patch){
    const rows = await this.list(res);
    const i = rows.findIndex(r=>r.id===id);
    if(i<0) throw new Error('Registro não encontrado.');
    rows[i] = { ...rows[i], ...patch, atualizadoEm:new Date().toISOString() };
    await this.save(res, rows); await this.log(`editou ${res}`, rows[i].nome||id);
    return rows[i];
  },
  async remove(res, id){
    const rows = await this.list(res);
    await this.save(res, rows.filter(r=>r.id!==id));
    await this.log(`excluiu ${res}`, id);
  },
  async getCfg(res, def){ return await kv.get(K[res](this.cid()), def); },
  async setCfg(res, val){ return await kv.set(K[res](this.cid()), val); },
  async log(acao, alvo){
    const rows = await kv.get(K.audit(this.cid()), []);
    rows.unshift({ id:uid('lg'), acao, alvo:String(alvo||''), por:S.user?.nome||'—', em:new Date().toISOString() });
    await kv.set(K.audit(this.cid()), rows.slice(0,200));
  },
  async company(patch){
    const c = { ...S.company, ...patch };
    await kv.set(K.company(c.id), c); S.company = c; return c;
  },

  /* --- MÉTRICAS: sempre calculadas, nunca armazenadas --- */
  async metrics(dias=30){
    const [orders, customers, products] = await Promise.all([
      this.list('orders'), this.list('customers'), this.list('products')
    ]);
    const desde = Date.now() - dias*864e5;
    const noPeriodo = orders.filter(o => new Date(o.criadoEm).getTime() >= desde);
    const pagos = noPeriodo.filter(o => o.status === 'Pago' || o.status === 'Concluído');
    const fat = pagos.reduce((s,o)=>s+o.total, 0);
    const perdidos = noPeriodo.filter(o=>o.status==='Cancelado').length;
    const porProduto = {};
    pagos.forEach(o=>o.itens.forEach(i=>{
      porProduto[i.nome] = (porProduto[i.nome]||0) + i.qtd;
    }));
    return {
      faturamento: fat,
      pedidos: noPeriodo.length,
      pagos: pagos.length,
      cancelados: perdidos,
      ticket: pagos.length ? fat/pagos.length : 0,
      conversao: noPeriodo.length ? (pagos.length/noPeriodo.length)*100 : 0,
      clientes: customers.length,
      produtos: products.filter(p=>p.ativo).length,
      totalProdutos: products.length,
      topProdutos: Object.entries(porProduto).sort((a,b)=>b[1]-a[1]).slice(0,5),
      serie: serieDiaria(pagos, Math.min(dias,14)),
      vazio: orders.length===0 && customers.length===0 && products.length===0
    };
  }
};

function serieDiaria(pedidos, dias){
  const out = [];
  for(let i=dias-1;i>=0;i--){
    const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-i);
    const fim = d.getTime()+864e5;
    out.push({ dia:d, valor: pedidos.filter(o=>{
      const t = new Date(o.criadoEm).getTime(); return t>=d.getTime() && t<fim;
    }).reduce((s,o)=>s+o.total,0) });
  }
  return out;
}

/* ---------------- UI: toast, modal ---------------- */
function toast(msg, kind='ok'){
  const t = el(`<div class="toast ${kind}"><span class="bar"></span><span>${esc(msg)}</span></div>`);
  $('#toasts').appendChild(t);
  anim(t,[{opacity:0,transform:'translateY(14px) scale(.97)'},{opacity:1,transform:'none'}],{d:M.dur.sm,e:M.ease.spring});
  setTimeout(()=>{
    const a = anim(t,[{opacity:1},{opacity:0,transform:'translateY(6px)'}],{d:M.dur.sm,e:M.ease.soft});
    a ? a.finished.then(()=>t.remove()) : t.remove();
  }, 3000);
}

let modals = [];
function modal({title, sub='', body, foot='', wide=false}){
  const scrim = el(`<div class="scrim" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="modal" ${wide?'style="max-width:760px"':''}>
      <div class="mhead"><div><h4>${esc(title)}</h4>${sub?`<p class="tiny" style="margin-top:3px">${esc(sub)}</p>`:''}</div>
      <button class="btn btn-icon btn-quiet" data-close aria-label="Fechar">✕</button></div>
      <div class="mbody">${body}</div>${foot?`<div class="mfoot">${foot}</div>`:''}
    </div></div>`);
  $('#overlay').appendChild(scrim); modals.push(scrim);
  anim(scrim,[{opacity:0},{opacity:1}],{d:M.dur.sm,e:M.ease.soft});
  const box = scrim.querySelector('.modal');
  anim(box, innerWidth<700
    ? [{transform:'translateY(28px)',opacity:.6},{transform:'none',opacity:1}]
    : [{transform:'translateY(12px) scale(.985)',opacity:0},{transform:'none',opacity:1}],
    {d:M.dur.md, e:M.ease.out});
  scrim.addEventListener('click', ev=>{ if(ev.target===scrim||ev.target.closest('[data-close]')) closeModal(); });
  scrim.querySelector('.mbody input, .mbody select, .mbody textarea')?.focus({preventScroll:true});
  return scrim;
}
function closeModal(){
  const m = modals.pop(); if(!m) return;
  const a = anim(m,[{opacity:1},{opacity:0}],{d:M.dur.xs,e:M.ease.soft});
  a ? a.finished.then(()=>m.remove()) : m.remove();
}
addEventListener('keydown', e=>{ if(e.key==='Escape' && modals.length) closeModal(); });

function confirmar({title, texto, cta='Confirmar', perigo=true}){
  return new Promise(res=>{
    const m = modal({title, sub:texto, body:'<p class="tiny">Esta ação não pode ser desfeita.</p>',
      foot:`<button class="btn btn-ghost" data-close>Cancelar</button>
            <button class="btn ${perigo?'btn-primary':'btn-primary'}" ${perigo?'style="background:var(--err)"':''} data-yes>${esc(cta)}</button>`});
    m.querySelector('[data-yes]').onclick = ()=>{ closeModal(); res(true); };
    m.addEventListener('click', e=>{ if(e.target===m||e.target.closest('[data-close]')) res(false); });
  });
}

/* botão com estado de carregamento real */
async function withLoading(btn, fn){
  const html = btn.innerHTML;
  btn.disabled = true; btn.innerHTML = `<span class="spin"></span>${btn.dataset.loading||'Salvando'}`;
  try { return await fn(); }
  catch(err){ toast(err.message || 'Não foi possível concluir.', 'err'); throw err; }
  finally { btn.disabled = false; btn.innerHTML = html; }
}

function bindLanding(){
  const h = $('#lph');
  const onScroll = () => h && h.classList.toggle('stuck', scrollY > 8);
  addEventListener('scroll', onScroll, {passive:true}); onScroll();
  reveal(document);
  $$('[data-scroll]').forEach(b=>b.onclick=()=>document.querySelector(b.dataset.scroll)?.scrollIntoView({behavior:RM.matches?'auto':'smooth'}));
  $$('[data-faq]').forEach(b=>{
    b.onclick = ()=>{
      const panel = $('#faq-a-'+b.dataset.faq);
      const open = b.getAttribute('aria-expanded')==='true';
      b.setAttribute('aria-expanded', !open);
      const full = panel.scrollHeight;
      if(open){
        anim(panel,[{height:full+'px'},{height:'0px'}],{d:M.dur.sm,e:M.ease.soft});
        panel.style.height='0px';
      } else {
        panel.style.height='auto';
        anim(panel,[{height:'0px'},{height:full+'px'}],{d:M.dur.md,e:M.ease.out})?.finished.then(()=>panel.style.height='auto');
      }
      const icn = b.querySelector('[data-faq-ic]');
      anim(icn,[{transform:`rotate(${open?45:0}deg)`},{transform:`rotate(${open?0:45}deg)`}],{d:M.dur.sm});
      icn.style.transform = `rotate(${open?0:45}deg)`;
    };
  });
  const menu = $('[data-lpmenu]');
  if(menu) menu.onclick = ()=>{
    modal({title:'Navegar', body:`<div class="grid" style="gap:8px">
      ${[['#problema','Produto'],['#recursos','Recursos'],['#como','Como funciona'],['#planos','Planos'],['#faq','FAQ']]
        .map(([h,l])=>`<button class="btn btn-ghost" style="justify-content:flex-start" data-jump="${h}">${l}</button>`).join('')}
      <button class="btn btn-primary" data-nav="register">Começar agora</button></div>`});
    $$('[data-jump]').forEach(b=>b.onclick=()=>{closeModal();document.querySelector(b.dataset.jump)?.scrollIntoView({behavior:'smooth'})});
  };
}

          estoque: es===''? null : parseInt(es)||0, sku:'', ean:'', categoria:'', descricao:'',
          variacoes:[], imagem:'', ativo:true });
      }},
    { t:'Como a IA deve atender', d:'Escreva em português. Ela usa isto junto com seus produtos cadastrados.',
      body:`<label class="field"><span>Tom de voz</span><select class="select" id="ob-tom">
              <option>Próximo e objetivo</option><option>Formal</option><option>Informal e descontraído</option></select></label>
            <label class="field"><span>Regras de atendimento</span><textarea class="textarea" id="ob-rg" placeholder="Ex.: nunca prometer prazo menor que 3 dias úteis; transferir para uma pessoa quando o cliente pedir desconto."></textarea></label>`,
      cta:'Concluir',
      run: async ()=>{
        const cfg = await api.getCfg('ai', {});
        await api.setCfg('ai', { ...cfg, nome:S.company.nome, tom:$('#ob-tom').value, regras:$('#ob-rg').value.trim(), ativa:false });
        await api.company({onboarded:true});
      }}
  ];
  const s = steps[obStep];
  const c = $('#ob-card');
  c.innerHTML = `
    <div class="row" style="gap:6px;margin-bottom:18px">${steps.map((_,i)=>`<span style="flex:1;height:4px;border-radius:2px;background:${i<=obStep?'var(--brand)':'var(--line)'}"></span>`).join('')}</div>
    <p class="tiny">Passo ${obStep+1} de ${steps.length}</p>
    <h2 style="font-size:21px;font-weight:600;letter-spacing:-.02em;margin:6px 0 6px">${s.t}</h2>
    <p class="muted" style="font-size:14px;margin-bottom:20px">${s.d}</p>
    ${s.body}
    <button class="btn btn-primary" style="width:100%;margin-top:6px" id="ob-next" data-loading="Salvando">${s.cta}</button>`;
  stagger(c.children, .035);
  $('#ob-next').onclick = e => withLoading(e.currentTarget, async ()=>{
    await s.run();
    if(obStep < steps.length-1){ obStep++; renderOb(); }
    else { toast('Tudo pronto. Seu painel está no ar.'); go('dashboard'); }
  });
}
function parseMoney(v){
  if(!v) return 0;
  const s = String(v).replace(/[^\d,.-]/g,'').replace(/\.(?=\d{3}\b)/g,'').replace(',','.');
  return Math.max(0, parseFloat(s)||0);
}

function openNav(){

function closeNav(instant){

  if(sb && innerWidth<1024){

async function formPedido(id){
  const [orders, produtos, clientes, team] = await Promise.all([
    api.list('orders'), api.list('products'), api.list('customers'), api.list('team')]);
  if(!produtos.filter(p=>p.ativo).length && !id){
    return modal({title:'Cadastre um produto primeiro',
      sub:'Um pedido precisa de itens para calcular valores.',
      body:'<p class="tiny">Assim que existir pelo menos um produto ativo no catálogo, o pedido pode ser criado.</p>',
      foot:`<button class="btn btn-ghost" data-close>Fechar</button>
            <button class="btn btn-primary" id="ir-prod">Ir para Produtos</button>`}),
      $('#ir-prod').onclick = ()=>{ closeModal(); openPage('produtos'); };
  }
  const o = id ? orders.find(r=>r.id===id) : { numero:'', clienteId:'', clienteNome:'', itens:[],
    desconto:0, status:'Rascunho', origem:'Manual', responsavel:S.user.nome, obs:'' };
  let itens = o.itens.map(i=>({...i}));

  const linhaItem = (i,idx) => `<div class="between" style="padding:9px 0;border-bottom:1px solid var(--line)">
      <div class="stack" style="flex:1"><span style="font-size:13.5px">${esc(i.nome)}</span>
        <span class="tiny">${i.qtd} × ${BRL(i.preco)}</span></div>
      <span class="row"><span class="strong num">${BRL(i.qtd*i.preco)}</span>
      <button class="btn btn-sm btn-quiet" data-rm="${idx}" aria-label="Remover">✕</button></span></div>`;

  const m = modal({ title: id?`Pedido ${o.numero}`:'Novo pedido',
    sub: id?`Criado em ${dtfmt(o.criadoEm)} · origem ${o.origem}`:'Os totais são calculados automaticamente.',
    body:`
      <label class="field"><span>Cliente *</span>
        <select class="select" id="o-cli">
          <option value="">Selecione ou cadastre abaixo</option>
          ${clientes.map(c=>`<option value="${c.id}" ${c.id===o.clienteId?'selected':''}>${esc(c.nome)}</option>`).join('')}
        </select></label>
      <label class="field"><span>Ou informe um cliente novo</span>
        <input class="input" id="o-novo-cli" placeholder="Nome do cliente" value="${id&&!o.clienteId?esc(o.clienteNome):''}"></label>
      <div class="sep"></div>
      <span class="tiny strong">Itens</span>
      <div id="o-itens" style="margin:8px 0">${itens.length?itens.map(linhaItem).join(''):'<p class="tiny">Nenhum item adicionado.</p>'}</div>
      <div class="row wrap" style="gap:8px;margin-bottom:6px">
        <select class="select" id="o-prod" style="flex:1;min-width:150px">
          ${produtos.filter(p=>p.ativo).map(p=>`<option value="${p.id}">${esc(p.nome)} — ${BRL(p.promo||p.preco)}</option>`).join('')}
        </select>
        <input class="input" id="o-qtd" type="number" min="1" value="1" style="width:78px">
        <button class="btn btn-quiet" id="o-add">Adicionar</button>
      </div>
      <div class="sep"></div>
      <div class="grid" style="grid-template-columns:1fr 1fr">
        <label class="field"><span>Desconto</span><input class="input" id="o-desc" inputmode="decimal" value="${o.desconto?String(o.desconto).replace('.',','):''}"></label>
        <label class="field"><span>Status</span><select class="select" id="o-status">
          ${STATUS_LIST.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></label>
      </div>
      <div class="grid" style="grid-template-columns:1fr 1fr">
        <label class="field"><span>Origem</span><select class="select" id="o-origem">
          ${['Manual','WhatsApp','IA','Indicação','Outro'].map(s=>`<option ${s===o.origem?'selected':''}>${s}</option>`).join('')}</select></label>
        <label class="field"><span>Responsável</span><select class="select" id="o-resp">
          ${team.map(t=>`<option ${t.nome===o.responsavel?'selected':''}>${esc(t.nome)}</option>`).join('')}</select></label>
      </div>
      <label class="field"><span>Observações</span><textarea class="textarea" id="o-obs">${esc(o.obs||'')}</textarea></label>
      <div class="card pad" style="box-shadow:none;background:var(--card-2)">
        <div class="between tiny"><span>Subtotal</span><span class="num" id="o-sub">${BRL(0)}</span></div>
        <div class="between tiny" style="margin-top:5px"><span>Desconto</span><span class="num" id="o-dsc">${BRL(0)}</span></div>
        <div class="sep" style="margin:11px 0"></div>
        <div class="between"><span class="strong">Total</span><span class="strong num" style="font-size:19px" id="o-tot">${BRL(0)}</span></div>
      </div>`,
    foot:`${id?'<button class="btn btn-danger" id="o-del">Excluir</button>':''}
          <button class="btn btn-ghost" data-close>Cancelar</button>
          <button class="btn btn-primary" id="o-save">${id?'Salvar pedido':'Criar pedido'}</button>`});
  bindCommon(m);

  const calc = () => {
    const sub = itens.reduce((s,i)=>s+i.qtd*i.preco,0);
    const d = Math.min(parseMoney($('#o-desc').value), sub);
    $('#o-sub').textContent = BRL(sub);
    $('#o-dsc').textContent = '− '+BRL(d);
    $('#o-tot').textContent = BRL(sub-d);
    return { sub, d, total: sub-d };
  };
  const redraw = () => {
    $('#o-itens').innerHTML = itens.length ? itens.map(linhaItem).join('') : '<p class="tiny">Nenhum item adicionado.</p>';
    $$('#o-itens [data-rm]').forEach(b=>b.onclick=()=>{ itens.splice(+b.dataset.rm,1); redraw(); });
    stagger($('#o-itens').children, .03);
    calc();
  };
  redraw();
  $('#o-desc').oninput = calc;
  $('#o-add').onclick = ()=>{
    const p = produtos.find(x=>x.id===$('#o-prod').value);
    const qtd = Math.max(1, parseInt($('#o-qtd').value)||1);
    if(!p) return;
    if(p.estoque!==null && p.estoque < qtd) toast(`Estoque de ${p.nome}: ${p.estoque}. O pedido será criado mesmo assim.`,'warn');
    const ex = itens.find(i=>i.produtoId===p.id);
    ex ? ex.qtd += qtd : itens.push({produtoId:p.id, nome:p.nome, preco:p.promo||p.preco, qtd});
    redraw();
  };
  if(id) $('#o-del').onclick = async ()=>{
    if(await confirmar({title:'Excluir pedido?', texto:`${o.numero} será removido do histórico e dos relatórios.`, cta:'Excluir'})){
      await api.remove('orders', id); closeModal(); openPage('pedidos'); toast('Pedido excluído.','warn');
    }
  };
  $('#o-save').onclick = e => withLoading(e.currentTarget, async ()=>{
    clearErrs();
    if(!itens.length) return toast('Adicione pelo menos um item ao pedido.','err');
    let clienteId = $('#o-cli').value, clienteNome = '';
    const novoNome = $('#o-novo-cli').value.trim();
    if(!clienteId && novoNome){
      const c = await api.create('customers', {nome:novoNome, telefone:'', email:'', tags:['pedido'], obs:''});
      clienteId = c.id; clienteNome = c.nome;
    } else if(clienteId){
      clienteNome = clientes.find(c=>c.id===clienteId)?.nome || '';
    } else {
      return fieldErr('o-novo-cli','Escolha um cliente ou informe um nome.');
    }
    const {d, total} = calc();
    const status = $('#o-status').value;
    const data = { clienteId, clienteNome, itens, desconto:d, total, status,
      origem:$('#o-origem').value, responsavel:$('#o-resp').value, obs:$('#o-obs').value.trim() };
    if(id) await api.update('orders', id, data);
    else {
      const n = (await api.list('orders')).length + 1;
      await api.create('orders', { numero:'#'+String(1000+n), ...data });
    }
    /* baixa de estoque quando o pedido é pago */
    if(status==='Pago' || status==='Concluído'){
      const prods = await api.list('products');
      let mudou = false;
      itens.forEach(i=>{ const p = prods.find(x=>x.id===i.produtoId);
        if(p && p.estoque!==null && !o.baixado){ p.estoque = Math.max(0, p.estoque - i.qtd); mudou = true; } });
      if(mudou){ await api.save('products', prods); if(id) await api.update('orders', id, {baixado:true}); }
    }
    closeModal(); openPage('pedidos'); toast(id?'Pedido atualizado.':'Pedido criado.');
  });
}

async function formAuto(id){
  const rows = await api.list('automations');
  const a = id ? rows.find(r=>r.id===id) : {nome:'',gatilho:GATILHOS[0],condicao:'',acao:ACOES[0],ativa:true};
  modal({title: id?'Editar automação':'Criar automação', sub:'Escolha o gatilho, a condição opcional e a ação.',
    body:`<label class="field"><span>Nome *</span><input class="input" id="a-nome" value="${esc(a.nome)}" placeholder="Ex.: Avisar gerente em pedido grande"></label>
      <label class="field"><span>Quando</span><select class="select" id="a-g">${GATILHOS.map(g=>`<option ${g===a.gatilho?'selected':''}>${g}</option>`).join('')}</select></label>
      <label class="field"><span>E se (opcional)</span><input class="input" id="a-c" value="${esc(a.condicao)}" placeholder="Ex.: o total for acima de R$ 1.000"></label>
      <label class="field"><span>Então</span><select class="select" id="a-a">${ACOES.map(x=>`<option ${x===a.acao?'selected':''}>${x}</option>`).join('')}</select></label>`,
    foot:`${id?'<button class="btn btn-danger" id="a-del">Excluir</button>':''}
          <button class="btn btn-ghost" data-close>Cancelar</button>
          <button class="btn btn-primary" id="a-save">${id?'Salvar':'Criar'}</button>`});
  if(id) $('#a-del').onclick = async ()=>{
    if(await confirmar({title:'Excluir automação?', texto:`“${a.nome}” deixa de rodar.`, cta:'Excluir'})){
      await api.remove('automations', id); closeModal(); openPage('automacoes'); toast('Automação excluída.','warn'); }
  };
  $('#a-save').onclick = e => withLoading(e.currentTarget, async ()=>{
    clearErrs();
    const nome = $('#a-nome').value.trim();
    if(!nome) return fieldErr('a-nome','Dê um nome à automação.');
    const data = {nome, gatilho:$('#a-g').value, condicao:$('#a-c').value.trim(), acao:$('#a-a').value};
    id ? await api.update('automations', id, data) : await api.create('automations', {...data, ativa:true, disparos:0});
    closeModal(); openPage('automacoes'); toast(id?'Automação atualizada.':'Automação criada.');
  });
}

let rPeriodo = 30;
PAGE.relatorios = async () => {
  const m = await api.metrics(rPeriodo);
  const orders = await api.list('orders');
  const h = phead('Relatórios','Tudo calculado sobre os pedidos registrados no período.',
    `<select class="select" id="r-per" style="width:auto">
      ${[[7,'Últimos 7 dias'],[30,'Últimos 30 dias'],[90,'Últimos 90 dias'],[365,'Últimos 12 meses']]
        .map(([v,l])=>`<option value="${v}" ${v===rPeriodo?'selected':''}>${l}</option>`).join('')}</select>`);
  if(!orders.length) return h + vazio('chart','Sem dados para relatar',
    'Os relatórios usam pedidos reais. Crie o primeiro pedido para começar a medir.',
    `<button class="btn btn-primary" data-page="pedidos">Ir para Pedidos</button>`);
  const porResp = {}, porOrigem = {};
  orders.filter(o=>o.status==='Pago'||o.status==='Concluído').forEach(o=>{
    porResp[o.responsavel||'—'] = (porResp[o.responsavel||'—']||0)+o.total;
    porOrigem[o.origem] = (porOrigem[o.origem]||0)+o.total;
  });
  const barra = (obj, cor) => {
    const ent = Object.entries(obj).sort((a,b)=>b[1]-a[1]);
    if(!ent.length) return '<p class="tiny">Nenhum pedido pago no período.</p>';
    const mx = ent[0][1];
    return ent.map(([n,v])=>`<div style="margin-bottom:12px">
      <div class="between tiny" style="margin-bottom:5px"><span style="color:var(--ink)">${esc(n)}</span><span class="num">${BRL(v)}</span></div>
      <div style="height:6px;background:var(--card-2);border-radius:4px;overflow:hidden">
        <div style="height:100%;width:${(v/mx)*100}%;background:${cor};border-radius:4px"></div></div></div>`).join('');
  };
  return h + `<div class="kpis" style="margin-bottom:16px">
      ${[['Faturamento',BRL(m.faturamento)],['Pedidos',NUM(m.pedidos)],['Ticket médio',BRL(m.ticket)],['Conversão',m.conversao.toFixed(0)+'%']]
        .map(([l,v])=>`<div class="kpi"><div class="l">${l}</div><div class="v" style="font-size:22px">${v}</div></div>`).join('')}</div>
    <div class="grid" style="grid-template-columns:1fr;gap:16px">
      <div class="card pad-lg"><div class="strong" style="margin-bottom:14px">Produtos mais vendidos</div>
        ${m.topProdutos.length?m.topProdutos.map(([n,q])=>{const mx=m.topProdutos[0][1];
          return `<div style="margin-bottom:12px"><div class="between tiny" style="margin-bottom:5px">
            <span style="color:var(--ink)">${esc(n)}</span><span class="num">${q} un.</span></div>
            <div style="height:6px;background:var(--card-2);border-radius:4px;overflow:hidden">
              <div style="height:100%;width:${(q/mx)*100}%;background:var(--brand);border-radius:4px"></div></div></div>`;
        }).join(''):'<p class="tiny">Nenhum produto vendido no período.</p>'}</div>
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(276px,1fr));gap:16px">
        <div class="card pad-lg"><div class="strong" style="margin-bottom:14px">Por responsável</div>${barra(porResp,'var(--accent)')}</div>
        <div class="card pad-lg"><div class="strong" style="margin-bottom:14px">Por origem</div>${barra(porOrigem,'var(--info)')}</div>
      </div>
      <div class="card pad-lg"><div class="strong" style="margin-bottom:12px">Resumo de clientes</div>
        ${[['Clientes cadastrados',NUM(m.clientes)],['Produtos ativos',NUM(m.produtos)],
           ['Pedidos cancelados',NUM(m.cancelados)],['Pedidos pagos',NUM(m.pagos)]]
          .map(([l,v])=>`<div class="between" style="padding:9px 0;border-bottom:1px solid var(--line)">
            <span style="font-size:13.5px">${l}</span><span class="strong num">${v}</span></div>`).join('')}</div>
    </div>`;
};

      .map(([l,v])=>`<div class="between" style="padding:9px 0;border-bottom:1px solid var(--line)">
        <span style="font-size:13.5px">${l}</span><span class="tiny">${v}</span></div>`).join('')}</div>`;
  if(cfgTab==='Dados'){
    const [p,c,o] = await Promise.all([api.list('products'),api.list('customers'),api.list('orders')]);
    const audit = await kv.get(K.audit(S.user.companyId), []);
    body = `<div class="card pad-lg">
      <span class="strong">Modo de demonstração</span>
      <p class="tiny" style="margin:6px 0 14px;max-width:58ch">Popula a conta com dados de exemplo, sempre marcados como demonstração. Serve para ver o painel cheio antes de cadastrar os seus dados.</p>
      ${S.demo
        ? `<button class="btn btn-danger" id="demo-off">Apagar dados de demonstração</button>`
        : `<button class="btn btn-ghost" id="demo-on" ${(p.length||c.length||o.length)?'disabled':''}>Carregar dados de demonstração</button>
           ${(p.length||c.length||o.length)?'<p class="hint">Disponível apenas em contas vazias, para não misturar com dados reais.</p>':''}`}
      <div class="sep"></div>
      <span class="strong">O que existe nesta empresa</span>
      ${[['Produtos',p.length],['Clientes',c.length],['Pedidos',o.length]]
        .map(([l,v])=>`<div class="between" style="padding:9px 0;border-bottom:1px solid var(--line)">
          <span style="font-size:13.5px">${l}</span><span class="strong num">${v}</span></div>`).join('')}
      <div class="sep"></div>
      <span class="strong">Registro de auditoria</span>
      <p class="tiny" style="margin:6px 0 10px">Últimas ações registradas nesta empresa.</p>
      ${audit.length? audit.slice(0,12).map(a=>`<div class="between" style="padding:8px 0;border-bottom:1px solid var(--line)">
          <span style="font-size:13px">${esc(a.acao)} — ${esc(a.alvo).slice(0,32)}</span>
          <span class="tiny">${dtfmt(a.em)}</span></div>`).join('')
        : '<p class="tiny">Nenhuma ação registrada ainda.</p>'}</div>`;
  }
  return phead('Configurações','Empresa, conta e dados.','')
    + `<div class="tabs">${abas.map(a=>`<button class="tab" aria-selected="${a===cfgTab}" data-ct="${a}">${a}</button>`).join('')}</div>` + body;
};
BIND.configuracoes = ()=>{
  $$('[data-ct]').forEach(b=>b.onclick=()=>{ cfgTab=b.dataset.ct; openPage('configuracoes'); });
  const s = $('#s-save'); if(s) s.onclick = e => withLoading(e.currentTarget, async ()=>{
    const n = $('#s-nome').value.trim();
    if(!n) return fieldErr('s-nome','O nome da empresa é obrigatório.');
    await api.company({nome:n, doc:$('#s-doc').value.trim(), telefone:$('#s-tel').value.trim(), endereco:$('#s-end').value.trim()});
    toast('Dados da empresa salvos.'); renderApp();
  });
  const t = $('#u-tema');
  if(t){ t.value = LS.get('astro-theme') || 'auto';
    t.onchange = ()=>{ setTheme(t.value); toast('Tema atualizado.'); }; }
  const u = $('#u-save'); if(u) u.onclick = e => withLoading(e.currentTarget, async ()=>{
    const nome = $('#u-nome').value.trim();
    if(nome.split(/\s+/).length<2) return fieldErr('u-nome','Escreva nome e sobrenome.');
    const users = await kv.get(K.users, []);
    const me = users.find(x=>x.id===S.user.id); me.nome = nome;
    await kv.set(K.users, users); S.user.nome = nome;
    toast('Perfil atualizado.'); renderApp();
  });
  const sg = $('#sg-save'); if(sg) sg.onclick = e => withLoading(e.currentTarget, async ()=>{
    clearErrs();
    const a=$('#sg-a').value, b=$('#sg-b').value;
    if(await sha256(S.user.salt+a) !== S.user.hash) return fieldErr('sg-a','Senha atual incorreta.');
    if(b.length<8) return fieldErr('sg-b','Use pelo menos 8 caracteres.');
    await api.resetPassword(S.user.email, b);
    await api.restore();
    toast('Senha alterada.');
  });
  const out = $('#sg-out'); if(out) out.onclick = sair;
  const don = $('#demo-on'); if(don) don.onclick = carregarDemo;
  const dof2 = $('#demo-off'); if(dof2) dof2.onclick = limparDemo;
  $$('[data-pref]').forEach(sw=>sw.addEventListener('toggled', async ev=>{
    const cur = await api.getCfg('notifications', {});
    const prefs = Array.isArray(cur) ? {} : cur;
    prefs[sw.dataset.pref] = ev.detail;
    await api.setCfg('notifications', prefs);
  }));
};

/* ================================================================
   DEMO — separado e identificado
   ================================================================ */
async function carregarDemo(){
  const ok = await confirmar({title:'Carregar dados de demonstração?',
    texto:'A conta será populada com produtos, clientes e pedidos de exemplo, identificados como demonstração. Você pode apagar tudo com um clique.',
    cta:'Carregar demonstração', perigo:false});
  if(!ok) return;
  const prods = [
    {nome:'Curso de Tráfego (DEMO)',preco:497,estoque:null,categoria:'Curso',descricao:'Produto de demonstração.'},
    {nome:'Ebook de Copy (DEMO)',preco:47,estoque:null,categoria:'Ebook',descricao:'Produto de demonstração.'},
    {nome:'Tênis Runner 42 (DEMO)',preco:389.9,estoque:12,categoria:'Físico',descricao:'Produto de demonstração.'}
  ];
  const criados = [];
  for(const p of prods) criados.push(await api.create('products',
    {...p, promo:0, sku:'', ean:'', variacoes:[], imagem:'', ativo:true, demo:true}));
  const clis = ['Marina Alves (DEMO)','Diego Santana (DEMO)','Paula Tavares (DEMO)','Rodrigo Lemos (DEMO)'];
  const cc = [];
  for(const n of clis) cc.push(await api.create('customers', {nome:n, telefone:'', email:'', tags:['demo'], obs:'', demo:true}));
  let n = 0;
  for(let i=0;i<14;i++){
    const cli = cc[i % cc.length], prod = criados[i % criados.length];
    const qtd = 1 + (i % 3);
    const total = qtd * prod.preco;
    const rows = await api.list('orders');
    rows.unshift({ id:uid('ord'), numero:'#'+String(1001+n++), clienteId:cli.id, clienteNome:cli.nome,
      itens:[{produtoId:prod.id, nome:prod.nome, preco:prod.preco, qtd}], desconto:0, total,
      status: i%5===0 ? 'Cancelado' : 'Pago', origem: i%2 ? 'IA' : 'Manual', responsavel:S.user.nome,
      obs:'', demo:true, criadoEm:new Date(Date.now() - i*1.6*864e5).toISOString() });
    await api.save('orders', rows);
  }
  await api.company({demo:true}); S.demo = true;
  toast('Dados de demonstração carregados.');
  renderApp();
}
async function limparDemo(){
  const ok = await confirmar({title:'Apagar dados de demonstração?',
    texto:'Todos os registros marcados como demonstração serão removidos. Dados que você cadastrou permanecem.', cta:'Apagar'});
  if(!ok) return;
  for(const res of ['products','customers','orders']){
    const rows = await api.list(res);
    await api.save(res, rows.filter(r=>!r.demo));
  }
  await api.company({demo:false}); S.demo = false;
  toast('Dados de demonstração removidos.','warn');
  renderApp();
}

/* ================================================================
   PAINÉIS: notificações e perfil
   ================================================================ */
async function painelNotificacoes(){
  const [orders, prods] = await Promise.all([api.list('orders'), api.list('products')]);
  const avisos = [];
  orders.filter(o=>o.status==='Aguardando pagamento').slice(0,4).forEach(o=>
    avisos.push(['warn', `${o.numero} aguardando pagamento`, `${o.clienteNome} · ${BRL(o.total)}`, dtfmt(o.criadoEm)]));
  prods.filter(p=>p.ativo && p.estoque!==null && p.estoque<5).forEach(p=>
    avisos.push([p.estoque<=0?'err':'warn', `Estoque de ${p.nome}`, p.estoque<=0?'Sem estoque':`Restam ${p.estoque}`, 'agora']));
  const cfg = await api.getCfg('ai', {});
  if(!cfg.ativa) avisos.push(['info','IA desativada','Ative em IA para começar a atender automaticamente','—']);
  const int = await api.getCfg('integrations', {});
  if((int.whatsapp||{}).status!=='conectado') avisos.push(['info','WhatsApp não conectado','Configure a integração para receber mensagens','—']);
  modal({title:'Avisos', sub: avisos.length?`${avisos.length} item(ns) que dependem de você`:'Nada pendente por aqui.',
    body: avisos.length ? avisos.map(([k,t,d,q])=>`<div class="between" style="padding:12px 0;border-bottom:1px solid var(--line)">
      <div class="row" style="align-items:flex-start"><span class="dot" style="margin-top:7px;color:var(--${k==='err'?'err':k==='warn'?'warn':'info'})"></span>
      <div class="stack"><span class="strong" style="font-size:13.5px">${esc(t)}</span><span class="tiny">${esc(d)}</span></div></div>
      <span class="tiny">${q}</span></div>`).join('')
      : '<p class="tiny">Os avisos são gerados a partir dos seus pedidos, estoque e integrações.</p>'});
}
function painelPerfil(){
  modal({title:S.user.nome, sub:`${S.user.email} · ${S.user.role} em ${S.company.nome}`,
    body:`<div class="grid" style="gap:8px">
      <button class="btn btn-ghost" style="justify-content:flex-start" data-jp2="configuracoes">Configurações</button>
      <button class="btn btn-ghost" style="justify-content:flex-start" data-jp2="equipe">Equipe</button>
      <button class="btn btn-ghost" style="justify-content:flex-start" data-theme>Alternar tema</button>
      <button class="btn btn-danger" style="justify-content:flex-start" id="pf-out">Sair da conta</button></div>`});
  $$('[data-jp2]').forEach(b=>b.onclick=()=>{ closeModal(); openPage(b.dataset.jp2); });
  $('#pf-out').onclick = ()=>{ closeModal(); sair(); };
}
async function sair(){
  await api.logout();
  toast('Você saiu da conta.','warn');
  go('landing');
}

/* ================================================================
   TEMA
   ================================================================ */
const LS = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return LS._m?.[k] ?? null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){ (LS._m||(LS._m={}))[k]=v; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){ if(LS._m) delete LS._m[k]; } }
};
function setTheme(v){
  if(v==='auto'){ LS.del('astro-theme');
    document.documentElement.setAttribute('data-theme', matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'); }
  else { LS.set('astro-theme', v); document.documentElement.setAttribute('data-theme', v); }
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme')==='dark' ? 'light' : 'dark';
  setTheme(cur);
}
setTheme(LS.get('astro-theme') || 'auto');
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{
  if(!LS.get('astro-theme')) setTheme('auto');
});

/* ================================================================
   ROTEADOR
   ================================================================ */
const ROUTES = {
  landing:  { render: viewLanding,   bind: bindLanding,   publica:true },
  login:    { render: viewLogin,     bind: bindLogin,     publica:true },
  register: { render: viewRegister,  bind: bindRegister,  publica:true },
  forgot:   { render: viewForgot,    bind: bindForgot,    publica:true },
  reset:    { render: viewReset,     bind: bindReset,     publica:true },
  onboarding:{render: viewOnboarding,bind: bindOnboarding,publica:false},
  dashboard:{ render: viewApp,       bind: bindApp,       publica:false }
};
function go(rota){
  if(!ROUTES[rota]) rota = 'landing';
  if(!ROUTES[rota].publica && !S.user){ rota = 'login'; toast('Faça login para continuar.','warn'); }
  S.route = rota;
  location.hash = '#/'+rota;
  const root = $('#root');
  root.innerHTML = ROUTES[rota].render();
  scrollTo({top:0});
  if(rota!=='landing') enter(root.firstElementChild, {d:M.dur.md});
  ROUTES[rota].bind();
  bindGlobal();
}
function renderApp(){ if(S.user) go('dashboard'); }
function bindGlobal(){
  $$('[data-nav]').forEach(b=>b.onclick=()=>go(b.dataset.nav));
  $$('[data-theme]').forEach(b=>b.onclick=toggleTheme);
  $$('[data-perfil]').forEach(b=>b.onclick=painelPerfil);
  $$('[data-notif]').forEach(b=>b.onclick=painelNotificacoes);
}

/* ================================================================
   BOOT
   ================================================================ */
(async function boot(){
  const root = $('#root');
  root.innerHTML = `<div style="min-height:60dvh;display:grid;place-items:center">
    <div class="logo" style="opacity:.4"><span class="logo-mark">A</span>Astro</div></div>`;
  let logado = null;
  try { logado = await api.restore(); } catch(e){}
  const hash = (location.hash||'').replace('#/','');
  if(logado){
    if(!S.company.onboarded) return go('onboarding');
    return go(ROUTES[hash] && !ROUTES[hash].publica ? hash : 'dashboard');
  }
  go(ROUTES[hash]?.publica ? hash : 'landing');
})();
addEventListener('hashchange', ()=>{
  const r = (location.hash||'').replace('#/','');
  if(r && r!==S.route && ROUTES[r]) go(r);
});
</script>
